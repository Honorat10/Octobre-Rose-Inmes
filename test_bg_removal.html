<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test BG Removal</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
</head>
<body style="background: #222; color: #fff; font-family: sans-serif; padding: 20px;">
  <h2>Testing SelfieSegmentation</h2>
  <div id="status">Loading model...</div>
  <div style="display: flex; gap: 20px; margin-top: 20px;">
    <div>
      <h3>Original</h3>
      <img id="origImg" src="assets/sample_photo.jpg" style="max-width: 300px;">
    </div>
    <div>
      <h3>Background Removed (Transparent on pink)</h3>
      <div style="background: #ea489b; padding: 10px; display: inline-block;">
        <canvas id="outputCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    const statusDiv = document.getElementById('status');
    const origImg = document.getElementById('origImg');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');

    const selfieSegmentation = new SelfieSegmentation({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });

    selfieSegmentation.setOptions({
      modelSelection: 1 // 1 for landscape/full body
    });

    selfieSegmentation.onResults((results) => {
      statusDiv.textContent = 'Results received! Processing canvas...';
      const w = origImg.naturalWidth;
      const h = origImg.naturalHeight;
      canvas.width = w;
      canvas.height = h;

      // 1. Draw mask
      ctx.save();
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(results.segmentationMask, 0, 0, w, h);

      // 2. destination-in: keep source only where mask is
      ctx.globalCompositeOperation = 'source-in';
      ctx.drawImage(origImg, 0, 0, w, h);
      ctx.restore();

      statusDiv.textContent = 'DONE! Successfully removed background.';
      window.__BG_REMOVAL_DONE__ = true;
    });

    origImg.onload = async () => {
      statusDiv.textContent = 'Image loaded, sending to model...';
      try {
        await selfieSegmentation.send({ image: origImg });
      } catch (e) {
        statusDiv.textContent = 'Error: ' + e.message;
        console.error(e);
      }
    };
  </script>
</body>
</html>
